name: portfolio
description: Developer Portfolio - Aero Glass Design
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  go_router: ^13.2.0
  url_launcher: ^6.2.6
  smooth_page_indicator: ^1.1.0
  visibility_detector: ^0.4.0+2
  flutter_animate: ^4.5.0
  glassmorphism: ^3.0.0
  font_awesome_flutter: ^10.7.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/chronicare/
    - assets/images/cdlaz/
    - assets/images/icons/
    - assets/images/icons/
    - assets/images/certificates/DEPI.png
    - assets/images/certificates/DEPIenglish.png
